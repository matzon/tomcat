name: Docker Build Test

on:
  push:
    branches:
      - feature/containerized-build
  pull_request:
    branches:
      - main

env:
  LC_ALL: en_US.UTF-8

jobs:
  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: make docker-rebuild

    - name: Fix Workspace Permissions
      run: |
        # GitHub Actions runner UID is 1001 (see: https://github.com/actions/runner-images/issues/10936)
        # Container runs as 1000:1000 (docker-compose.yml default)
        # Chown workspace so container can write output directories
        sudo chown -R 1000:1000 .

    - name: Build Tomcat
      run: make build

    - name: Run Tests
      run: make test

    - name: Upload Build Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v6
      with:
        name: docker-build-artifacts
        path: |
          output/build/lib/*.jar
          output/build/logs/
        retention-days: 7

    - name: Upload Test Logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v6
      with:
        name: docker-test-logs
        path: |
          hs_err_*.log
          output/build/logs/TEST*.txt
        retention-days: 7
