# =============================================================================
# Apache Tomcat Containerized Build - Docker Compose Configuration
# =============================================================================
# This docker-compose file defines services for building and testing Apache
# Tomcat in a containerized environment.
#
# Usage:
#   docker compose run --rm tomcat-build   # Build Tomcat
#   docker compose run --rm tomcat-test    # Build and test Tomcat
#
# Or use the Makefile for a simpler interface:
#   make build   # Uses tomcat-build service
#   make test    # Uses tomcat-test service
#
# BuildKit Support:
#   The Dockerfile uses BuildKit cache mounts for optimal performance.
#   Enable BuildKit: export DOCKER_BUILDKIT=1 (auto-enabled in Makefile)
#
# Caching Strategy:
#   - BuildKit cache mounts: Used during image build (docker build)
#   - Docker volumes: Used during container run (docker compose run)
#   Both caching mechanisms work together for optimal performance.
# =============================================================================

services:
  # ===========================================================================
  # Build Service - Build Tomcat without tests
  # ===========================================================================
  tomcat-build:
    build:
      context: .
      target: builder
      dockerfile: Dockerfile
    image: tomcat-builder:latest
    container_name: tomcat-build
    volumes:
      - .:/workspace
      - tomcat-build-libs:/workspace/tomcat-build-libs
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - ant
      - -noinput
      - -Dexecute.validate=false
      - -Dexecute.spotbugs=false
      - deploy
    restart: "no"

  # ===========================================================================
  # Test Service - Build Tomcat and run tests
  # ===========================================================================
  tomcat-test:
    build:
      context: .
      target: builder
      dockerfile: Dockerfile
    image: tomcat-builder:latest
    container_name: tomcat-test
    volumes:
      - .:/workspace
      - tomcat-build-libs:/workspace/tomcat-build-libs
    environment:
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US:en
      - TEST_THREADS=${TEST_THREADS:-2}
    user: "${UID:-1000}:${GID:-1000}"
    command:
      - ant
      - -noinput
      - -Dexecute.validate=false
      - -Dexecute.spotbugs=false
      - -Dexecute.test.nio=true
      - -Dtest.threads=${TEST_THREADS:-2}
      - -Dtest.verbose=false
      - -Dtest.silent=false
      - deploy
      - test
    restart: "no"

# =============================================================================
# Volumes
# =============================================================================
volumes:
  # Persistent volume for dependency cache
  # This volume stores downloaded dependencies (~100MB) to speed up subsequent
  # builds. Dependencies are rarely updated, so caching them provides significant
  # performance improvements (2-3 min builds vs 8-12 min cold builds).
  #
  # To clear the cache and force re-download:
  #   docker volume rm tomcat-build-libs
  tomcat-build-libs:
    driver: local
